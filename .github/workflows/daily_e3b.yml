name: Daily E3b Silver Assistant

on:
  schedule:
    # Утренний запуск: 08:00 MSK = 05:00 UTC
    - cron: '0 5 * * 1-5'
    # Дневной запуск: 14:00 MSK = 11:00 UTC
    - cron: '0 11 * * 1-5'
    # Вечерний запуск: 22:00 MSK = 19:00 UTC
    - cron: '0 19 * * 1-5'
  workflow_dispatch:            # ручной запуск из UI GitHub

permissions:
  contents: write               # нужно чтобы коммитить отчёты обратно

jobs:
  daily-e3b-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv lightgbm catboost yfinance pyarrow seaborn

      - name: Run E3b daily pipeline (refresh + walk-forward + signal)
        id: e3b_run
        env:
          # Telegram notifications (опционально)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          # Tinkoff sandbox — для fallback'а в send_portfolio_chart: cron-раннер
          # делает fresh checkout без локальной argentum.db (правильно в gitignore,
          # юзер-данные не коммитим), и без этого токена PNG-чарт в TG показывает
          # «0 позиций», хотя в Tinkoff sandbox у юзера открыты ордера.
          TINKOFF_TOKEN: ${{ secrets.TINKOFF_TOKEN }}
          # Daily heartbeat — на утреннем cron (08:00 MSK = 05:00 UTC)
          # шлём TG даже при is_repeat, чтобы юзер видел что система жива.
          # На дневном/вечернем cron — только при смене сигнала.
          TG_HEARTBEAT: ${{ github.event.schedule == '0 5 * * 1-5' && '1' || '0' }}
          # Manual run (workflow_dispatch) всегда форсит отправку TG —
          # это нужно для тестов, иначе дедуп заглушит сообщение при is_repeat.
          FORCE_TG_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python scripts/daily_e3b.py
        continue-on-error: true   # отчёты всё равно сохранятся; падение ловится ниже

      - name: Notify Telegram on pipeline failure
        # Срабатывает когда e3b_run действительно упал, даже при continue-on-error.
        # Без этого падения cron невидимы (workflow зелёный) — как было 02–07.06.
        if: steps.e3b_run.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG creds missing — skip failure notification"; exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$'❌ *E3b cron crashed*\n'"Run #${{ github.run_number }} on \`${{ github.event.schedule || 'manual' }}\`"$'\n'"$RUN_URL"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "disable_web_page_preview=true" || true

      - name: Commit updated data and reports
        if: always()              # коммитим даже если пайплайн упал — частичные отчёты могут быть полезны
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Обновлённые данные + отчёты + walk-forward результаты
          git add daily_reports/e3b/ \
                  data/multi_asset/metals/ \
                  data/multi_asset/macro/ \
                  data/multi_asset/features/ \
                  data/multi_asset/labels/ \
                  data/multi_asset/reports/ \
                  baseline_outputs_multiasset/e3b_adaptive/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily E3b run $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Upload reports as artifact (хранятся 90 дней)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3b-daily-reports-${{ github.run_id }}
          path: daily_reports/e3b/
          retention-days: 90

<svg width="680" viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Автоматизация -->
  <rect x="40" y="48" width="260" height="58" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="170" y="72" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Автоматизация</text>
  <text x="170" y="90" text-anchor="middle" font-size="12" fill="#854F0B">GitHub Actions · 3×/день</text>

  <!-- ML-конвейер -->
  <rect x="40" y="150" width="260" height="58" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="170" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">ML-конвейер</text>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#993C1D">признаки → walk-forward</text>

  <!-- Telegram -->
  <rect x="360" y="150" width="260" height="58" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="490" y="174" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Telegram</text>
  <text x="490" y="192" text-anchor="middle" font-size="12" fill="#854F0B">уведомления + график</text>

  <!-- Backend -->
  <rect x="40" y="252" width="260" height="58" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="170" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Backend API</text>
  <text x="170" y="294" text-anchor="middle" font-size="12" fill="#0F6E56">FastAPI · сигнал, позиции</text>

  <!-- SQLite -->
  <rect x="360" y="252" width="260" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="490" y="276" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Хранилище SQLite</text>
  <text x="490" y="294" text-anchor="middle" font-size="12" fill="#5F5E5A">positions · closed_trades</text>

  <!-- Frontend -->
  <rect x="40" y="354" width="260" height="58" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="170" y="378" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Frontend</text>
  <text x="170" y="396" text-anchor="middle" font-size="12" fill="#534AB7">Next.js · 4 вкладки</text>

  <!-- Связи -->
  <line x1="170" y1="106" x2="170" y2="150" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="208" x2="170" y2="252" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="310" x2="170" y2="354" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="179" x2="360" y2="179" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="281" x2="360" y2="281" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="178" y="234" text-anchor="start" font-size="12" fill="#5F5E5A">signal.json</text>
  <text x="178" y="336" text-anchor="start" font-size="12" fill="#5F5E5A">HTTP /api</text>
